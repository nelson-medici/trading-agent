[tool.poetry]
name = "trading-agent-engine"
version = "0.1.0"
description = "Disciplined quantitative trading engine"
authors = ["Nelson"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# HTTP y async
aiohttp = "^3.9"
httpx = "^0.27"
# Data
pandas = "^2.2"
numpy = "^1.26"
ta = "^0.11.0"
# Exchange
ccxt = "^4.3"
# Equities data (Yahoo Finance)
yfinance = "^0.2.40"
# DB
supabase = "^2.7"
asyncpg = "^0.29"
# Config
pydantic = "^2.7"
pydantic-settings = "^2.4"
python-dotenv = "^1.0"
pyyaml = "^6.0"
# Scheduler
apscheduler = "^3.10"
# Logging
structlog = "^24.4"
# Alerts
python-telegram-bot = "^21.4"
# LLM
anthropic = "^0.34"
groq = "^0.11"
# Testing
pytest = "^8.3"
pytest-asyncio = "^0.24"
hypothesis = "^6.111"
# Utils
click = "^8.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
